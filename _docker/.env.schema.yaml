envSchema:
  # ---------------------------------------------------------------------------
  # Common
  # ---------------------------------------------------------------------------
  - name: IMAGE_BASE_PATH
    label: Image Registry Base Path
    description: "Base path of the container registry from which all Gaeco service images are pulled."
    type: text
    required: true
    default: ghcr.io/gaeco-ekkodale

  - name: ASPNETCORE_ENVIRONMENT
    label: ASP.NET Core Environment
    description: "Runtime environment for the .NET backend (e.g. Development, Staging, Production)."
    type: text
    required: true
    default: Development

  - name: OTLP_ENDPOINT
    label: OpenTelemetry OTLP Endpoint
    description: "Endpoint where telemetry data is exported."
    type: text
    required: true
    default: http://gaeco-monitor-aspire:18889

  # ---------------------------------------------------------------------------
  # External Service Hostnames
  # ---------------------------------------------------------------------------
  - name: KEYCLOAK_SERVER_HOSTNAME
    label: Keycloak Server Hostname
    description: "Hostname (and optional port) used to reach the Keycloak server. The protocol (https://) is prepended by the compose file."
    type: text
    required: true

  # ---------------------------------------------------------------------------
  # Authentication
  # ---------------------------------------------------------------------------
  - name: KEYCLOAK_REALM
    label: Keycloak Realm
    description: "Keycloak realm used for authentication."
    type: text
    required: true
    default: gaeco

  # ---------------------------------------------------------------------------
  # Kafka
  # ---------------------------------------------------------------------------
  - name: KAFKA_ADDRESS
    label: Kafka Address
    description: "Kafka bootstrap server address (network alias on gaeco-network)."
    type: text
    required: true
    default: gaeco-broker:29092

  - name: KAFKA_AUTO_OFFSET_RESET
    label: Kafka Auto Offset Reset
    description: "Consumer offset reset policy when no initial offset exists."
    type: text
    required: true
    default: Earliest

  - name: KAFKA_SESSION_TIMEOUT_MS
    label: Kafka Session Timeout (ms)
    description: "Timeout in milliseconds used to detect consumer failures."
    type: text
    required: true
    default: 150000

  - name: KAFKA_MAX_POLL_INTERVAL_MS
    label: Kafka Max Poll Interval (ms)
    description: "Maximum allowed delay between consumer poll calls in milliseconds."
    type: text
    required: true
    default: 1500000

  - name: KAFKA_TOPICS_USECASE
    label: Kafka Topic (UseCase)
    description: "Kafka topic used by the UseCase service."
    type: text
    required: true
    default: ekkodale.gaeco.usecase.public.usecases

  # ---------------------------------------------------------------------------
  # UseCase Service
  # ---------------------------------------------------------------------------
  - name: USECASE_SERVER_HOSTNAME
    label: UseCase Server Hostname
    description: "Hostname under which the UseCase Service server is reachable (used for Traefik routing)."
    type: text
    required: true

  - name: USECASE_POSTGRES_DATABASE
    label: UseCase Postgres Database
    description: "Database name for the UseCase service PostgreSQL instance."
    type: text
    required: true
    default: usecasedb

  - name: USECASE_POSTGRES_USER
    label: UseCase Postgres User
    description: "Database user for the UseCase service PostgreSQL instance."
    type: text
    required: true
    default: usecase_user

  - name: USECASE_POSTGRES_PASSWORD
    label: UseCase Postgres Password
    description: "Database password for the UseCase service PostgreSQL instance."
    type: password
    required: true

  - name: MOUNT_ROUTE
    label: Microfrontend Mount Route
    description: "Base path where the micro-frontend will be mounted in the host application (e.g. /plugin1)."
    type: text
    required: true
    default: /usecase
